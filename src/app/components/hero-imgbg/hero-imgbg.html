<div class="hero min-h-70 bg-base-200" [style]="backgroundImg()">
  <div class="hero-overlay rounded-4xl"></div>

  <div
    class="hero-content text-neutral-content text-center justify-center md:justify-end md:text-left md:w-full"
  >
    <div class="max-w-md text-center md:text-left">
      <h1 class="mb-5 text-5xl font-bold">{{ title() }}</h1>
      <p class="mb-5">
        {{ description() }}
      </p>
    </div>
  </div>
</div>
