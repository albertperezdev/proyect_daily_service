<div class="hero px-5 pt-5 md:px-20 3xl:px-25 min-h-3.5">
  <div class="hero-content flex-col lg:flex-row-reverse">
    <img [src]="img()" class="max-w-70 rounded-lg" />
    <div>
      <h1 class="text-5xl 3xl:text-6xl font-bold">{{ title() }}</h1>
      <p class="py-6 3xl:text-[20px]">
        {{ description() }}
      </p>
    </div>
  </div>
</div>
