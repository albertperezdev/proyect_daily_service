<div
  class="bg-base-200 card card-side items-center m-3 transition-transform duration-450 hover:-translate-y-2"
>
  <figure class="flex justify-center items-center w-1/3 p-2">
    <i [class]="icon()" class="text-5xl text-primary"></i>
  </figure>

  <div class="card-body w-2/3">
    <h2 class="card-title">{{ tittle() }}</h2>
    <p>
      {{ description() }}
    </p>
  </div>
</div>
