<div
  class="card bg-base-200 h-45 shadow-sm flex flex-row items-center justify-between p-6 rounded-2xl md:col-span-3 transition-all duration-300 ease-out hover:-translate-y-2 hover:shadow-lg hover:border-primary hover:scale-[1.02]"
>
  <figure class="flex items-center space-x-6 h-20">
    <i [class]="icon()" class="text-4xl text-primary"></i>
  </figure>
  <div class="card-body w-3/4">
    <h2 class="card-title">{{ tittle() }}</h2>
    <p>{{ description() }}</p>
  </div>
</div>
