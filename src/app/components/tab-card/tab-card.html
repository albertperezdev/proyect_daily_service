<article
  class="card bg-base-100 shadow-sm border border-base-300 overflow-hidden md:h-97 xl:h-97"
>
  <div class="grid grid-cols-1 lg:grid-cols-2 h-full">
    <!-- Imagen a la izquierda -->
    <figure class="bg-base-200 h-56 lg:h-auto">
      <div class="w-full h-full lg:min-h-[360px]">
        <img
          class="w-full h-full object-cover object-center"
          [src]="img()"
          alt="Team 3"
        />
      </div>
    </figure>

    <!-- Contenido a la derecha (ajustado proporcionalmente) -->
    <div class="card-body flex flex-col justify-center px-8 py-10">
      <span class="text-sm font-semibold text-base-content/70 mb-2">{{
        keyWord()
      }}</span>
      <h3 class="text-2xl font-semibold leading-snug mb-3">
        {{ title() }}
      </h3>
      <p class="text-base-content/70 text-sm mb-6">
        {{ description() }}
      </p>
    </div>
  </div>
</article>
